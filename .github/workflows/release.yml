name: Semantic release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: semantic-release
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install tmux for isolated workspace integration tests
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes tmux
          fi
      - run: make check
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings
  version:
    needs: check
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Start checks on generated release PRs
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          python3 - <<'PYPRS'
          import json, os, subprocess
          for pr in json.loads(os.environ['RELEASE_PRS']):
              branch = pr['headBranchName']
              for workflow in ['checks.yml', 'security.yml', 'beta.yml']:
                  subprocess.run(['gh', 'workflow', 'run', workflow, '--ref', branch], check=True)
          PYPRS
  binary:
    needs: version
    if: needs.version.outputs.released == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/binary.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
